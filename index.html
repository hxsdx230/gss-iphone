function search(){let title=names[page],controls='',q=query.mode===page?query:{};if(page==='chemical')controls=`<div class="field"><label>薬剤名</label><input id="qname" value="${esc(q.name||'')}" placeholder="商品名を入力"></div>`;else controls=`<div class="field"><label>作業場所</label><select id="qarea">${opts(locations(),'場所を選択',q.area||'')}</select></div><div class="field"><label>作業部材</label><select id="qpart">${opts(partsFor(q.area||''),'部材を選択',q.part||'')}</select></div>${page==='soil'?`<div class="field"><label>使用したい汚れ</label><select id="qsoil">${opts(soilsFor(q.area||'',q.part||''),'汚れを選択',q.soil||'')}</select></div>`:`<div class="field"><label>汚れ（任意）</label><select id="qsoil">${opts(soilNames(),'汚れを選択',q.soil||'')}</select></div>`}`;
return `<div class="card"><h2>${title}</h2><p class="muted">${page==='parts'?'作業場所を選ぶと部材候補が絞り込まれます。作業場所と作業部材を選んで検索してください。':page==='chemical'?'薬剤名を入力して検索してください。':'項目を選んで検索すると、候補商品が表示されます。'} 候補は使用可能の保証ではありません。</p><div class="fields" ${page==='chemical'?'style="grid-template-columns:1fr auto"':''}>${controls}<button class="btn primary" id="searchBtn">検索</button></div></div><div id="searchResult"></div>`}
function wire(){const area=document.getElementById('qarea'),part=document.getElementById('qpart'),soil=document.getElementById('qsoil');if(area&&part)area.onchange=()=>{part.innerHTML=opts(partsFor(area.value),'部材を選択');if(soil&&page==='soil')soil.innerHTML=opts(soilsFor(area.value,''),'汚れを選択')};if(part&&soil&&page==='soil')part.onchange=()=>soil.innerHTML=opts(soilsFor(area?.value||'',part.value),'汚れを選択');const sb=document.getElementById('searchBtn');if(sb)sb.onclick=()=>{const q={mode:page,area:document.getElementById('qarea')?.value||'',part:document.getElementById('qpart')?.value||'',soil:document.getElementById('qsoil')?.value||'',name:document.getElementById('qname')?.value||''};if(page==='parts'&&(!q.area||!q.part)){alert('作業場所と作業部材を選択してください');return}if(page==='chemical'&&!q.name.trim()){alert('薬剤名を入力してください');return}query=q;document.getElementById('searchResult').innerHTML=searchResults(q)};}
function searchResults(q){
 const areaRows=db.locations.filter(r=>(!q.area||r['作業分野']===q.area)&&(!q.part||r['作業場所・部位']===q.part)),locids=new Set(areaRows.map(r=>r.LocationID));
 const mappedSoils=new Set(db.mapping.filter(r=>!locids.size||locids.has(r.LocationID)).map(r=>r.SoilID));
 const pickedSoil=db.soils.find(r=>r['汚れ名称']===q.soil)?.SoilID;
 const soilIds=q.soil?new Set(pickedSoil&&(!locids.size||mappedSoils.has(pickedSoil))?[pickedSoil]:[]):mappedSoils;
 const assoc=db.soilCandidates||[];
 const groups=[...soilIds].map(id=>assoc.filter(r=>r.SoilID===id).sort((a,b)=>parseInt(a['候補順位'].replace(/\D/g,''))-parseInt(b['候補順位'].replace(/\D/g,''))));
 const linkedSourceIds=new Set(groups.flat().map(r=>r.ProductID));
 const candBySource=new Map([...db.products.filter(p=>p.CandidateSourceProductID||p.SourceProductID),...db.candidates].map(p=>[p.CandidateSourceProductID||p.SourceProductID,p]));
 let candidates=[];
 if(q.name){candidates=db.candidates.filter(p=>String(p['商品名']).toLowerCase().includes(q.name.toLowerCase()))}
 else {const seen=new Set();for(let rank=0;rank<10;rank++)for(const group of groups){const row=group[rank],p=row&&candBySource.get(row.ProductID);if(p&&!seen.has(p.ProductID)){seen.add(p.ProductID);candidates.push(p)}}}
 const soilMismatch=Boolean(q.soil&&pickedSoil&&locids.size&&!mappedSoils.has(pickedSoil));
 const pids=new Set(db.conditions.filter(c=>(!locids.size||locids.has(c.LocationID))&&(!q.soil||soilIds.has(c.SoilID))).map(c=>c.ProductID));
 let products=db.products.filter(p=>pids.has(p.ProductID));
 if(soilMismatch){products=[];candidates=[]}
 for(const row of assoc.filter(r=>soilIds.has(r.SoilID))){const promoted=db.products.find(p=>p.CandidateSourceProductID===row.ProductID);if(promoted&&!products.some(p=>p.ProductID===promoted.ProductID))products.push(promoted)}
 if(q.name)products=db.products.filter(p=>(p['商品名']||'').toLowerCase().includes(q.name.toLowerCase()));
 if(!q.area&&!q.part&&!q.soil&&!q.name){candidates=[];products=[]}
 const all=[...products,...candidates],dedup=[];const productNames=new Set();for(const p of all){const n=String(p['商品名']||'').trim().toLowerCase();if(!productNames.has(n)){productNames.add(n);dedup.push(p)}}const list=dedup;
 const soilLabel=[...soilIds].map(id=>db.soils.find(s=>s.SoilID===id)?.['汚れ名称']).filter(Boolean).join('・');const exactIds=new Set(dedup.map(p=>p.ProductID)),ingredientGroups=new Set(dedup.map(p=>p['成分分類']).filter(Boolean)),related=q.mode==='chemical'&&ingredientGroups.size?[...new Map([...db.products,...db.candidates].filter(p=>ingredientGroups.has(p['成分分類'])&&!exactIds.has(p.ProductID)).map(p=>[p.ProductID,p])).values()]:[];
 return `<div class="card"><h2>商品候補 <span class="muted">${dedup.length}件</span></h2><div class="notice">${soilLabel?'この場所・部材に関連づけられた汚れ候補：'+esc(soilLabel)+'。':'汚れ候補を選ぶと、その汚れ別の商品候補に絞り込めます。'} 薬剤で溶かす方法、研磨剤で削り取る方法など、登録された選択肢を表示します。商品ごとの用途・素材・希釈倍率を詳細で確認し、現場で選択してください。</div><div class="list" style="margin-top:14px">${list.map(p=>productRow(p,db.candidates.includes(p))).join('')||'<p>条件に対応する商品候補がありません。汚れを選ぶか、場所・部材を変更してください。</p>'}</div></div>${related.length?`<div class="card"><h2>近い成分の薬剤一覧 <span class="muted">${related.length}件</span></h2><div class="notice">登録情報で成分分類が一致する商品です。同じ成分系統でも、用途・濃度・対象素材・使用方法は商品ごとに異なります。</div><div class="list" style="margin-top:14px">${related.map(p=>productRow(p,db.candidates.includes(p))).join('')}</div></div>`:''}<div class="card add-product-card"><h3>一覧にない商品を追加</h3><p class="muted">商品名・メーカー名を入力して商品マスタに確認待ちで追加します。現在の検索条件があれば、場所・部材・汚れとの関連も登録します。</p><div class="fields" style="grid-template-columns:minmax(200px,1fr) minmax(200px,1fr) auto"><div class="field"><label for="newProductName">商品名</label><input id="newProductName" placeholder="商品名を入力"></div><div class="field"><label for="newProductMaker">メーカー名</label><input id="newProductMaker" placeholder="メーカー名を入力"></div><button class="btn primary" onclick="addProductFromSearch()">商品マスタに追加</button></div></div>`
}
function addProductFromSearch(){const name=document.getElementById('newProductName')?.value.trim(),maker=document.getElementById('newProductMaker')?.value.trim();if(!name||!maker){alert('商品名とメーカー名を入力してください');return}const duplicate=[...db.products,...db.candidates].find(p=>String(p['商品名']||'').trim().toLocaleLowerCase()===name.toLocaleLowerCase()&&String(p['メーカー']||'').trim().toLocaleLowerCase()===maker.toLocaleLowerCase());if(duplicate){alert('同じ商品名・メーカー名の組み合わせが既に登録済み、または候補にあります。');return}const id='P'+Date.now(),product={ProductID:id,'商品画像URL':'','商品名':name,'メーカー':maker,'商品分類・用途':'未確認','商品ランク（一押し/標準/参考）':'参考','確認状況':'未確認・確認待ち','安全ステータス':'未確認','備考':'検索結果から追加。メーカー情報・現行ラベル/SDS・希釈倍率・使用可能素材を確認してください。'};db.products.unshift(product);const locs=(query.area||query.part||query.soil)?db.locations.filter(r=>(!query.area||r['作業分野']===query.area)&&(!query.part||r['作業場所・部位']===query.part)):[],ids=new Set(locs.map(r=>r.LocationID)),soilId=db.soils.find(r=>r['汚れ名称']===query.soil)?.SoilID,soils=query.soil?(soilId?[soilId]:[]):[...new Set(db.mapping.filter(r=>ids.size&&ids.has(r.LocationID)).map(r=>r.SoilID))];let n=0;for(const loc of locs)for(const sid of soils){if(db.conditions.some(c=>c.ProductID===id&&c.LocationID===loc.LocationID&&c.SoilID===sid))continue;db.conditions.push({UseConditionID:'UC'+Date.now()+String(n++),ProductID:id,LocationID:loc.LocationID,SoilID:sid,'安全ステータス':'未確認・確認待ち','判定範囲・理由':'検索画面から商品名とメーカー名で追加。メーカー表示・対象素材・現場使用条件の確認待ち。'})}save();selected=id;go('detail')}
function results(){return `<div class="card"><button class="btn" onclick="go(query.mode||'place')">← 条件を変更</button><h2>検索結果</h2><p class="muted">検索条件：${esc(query.area||'場所指定なし')} / ${esc(query.part||'部材指定なし')} / ${esc(query.soil||query.name||'汚れ指定なし')}</p></div>${searchResults(query)}`}

function detail(){const p=db.products.find(x=>x.ProductID===selected)||db.candidates.find(x=>x.ProductID===selected);if(!p)return `<div class="card">商品が見つかりません <button class="btn" onclick="go('home')">TOP</button></div>`;const conditions=db.conditions.filter(c=>c.ProductID===selected);const cand=db.candidates.includes(p),prohibited=String(p['安全ステータス']||'').includes('使用禁止'),offLabel=String(p['安全ステータス']||'').includes('メーカー用途外');const fields=[['分類・用途',['商品分類・用途','候補にした汚れ・作業']],['容量',['容量バリエーション']],['価格',['価格・価格根拠','価格']],['候補汚れ',['メーカー記載の用途/候補汚れ','候補にした汚れ・作業','対応する汚れ・作業']],['メーカー情報',['メーカー公式URL','出典URL','メーカー公式根拠URL']],['現行ラベル/SDS',['現行ラベル/SDS URL','SDS URL']],['使用可能素材',['使用可能素材','メーカー記載の使用可能素材・対象']],['使用禁止素材',['使用禁止素材','メーカー記載の使用禁止素材','使用禁止素材・条件']],['成分・液性',['液性・成分']],['成分分類',['成分分類']],['成分情報出典',['成分情報出典URL']],['希釈倍率',['希釈倍率','希釈倍率・調製方法']],['備考',['備考']],['使用方法',['使用方法','使用方法・塗布量']],['放置時間',['放置時間']],['すすぎ方法',['すすぎ方法','すすぎ・拭き取り方法']],['安全ステータス',['安全ステータス']],['注意事項',['注意事項・安全対策','注意事項・保護具']]];return `<div class="card"><button class="btn" onclick="go('results',query)">← 商品一覧へ</button><h2>${esc(p['商品名'])}</h2><p>${esc(p['メーカー'])}　<span class="badge reference">${esc(p['商品ランク（一押し/標準/参考）']||p['商品ランク']||'参考')}</span> ${cand?'<button class="btn primary" onclick="promote(\''+esc(p.ProductID)+'\')">商品マスタに追加</button>':''}</p>${prohibited?'<div class="notice"><b>使用禁止・メーカー用途外</b><br>浴室・鏡への使用はメーカー非推奨で、安全性は保証されていません。塩素系製品と混ぜると有毒ガスのおそれがあります。</div>':offLabel?'<div class="notice"><b>メーカー用途外・現場使用情報あり</b><br>現場使用情報はユーザー提供です。メーカー指定用途外のため、ラベル・SDSと対象素材を確認して現場基準で判断してください。塩素系製品とは絶対に混ぜないでください。</div>':`<div class="notice">${cand?'未確認の購入・比較候補です。商品情報や現行性はメーカー資料でご確認ください。':'登録済みマスタの候補情報です。公式ラベル・SDSと現場条件を照合するまで、使用可否・手順は確定しません。'}</div>`}<div class="detailgrid">${fields.map(([label,aliases])=>`<div>${label}</div><div>${url(productField(p,conditions,aliases))}</div>`).join('')}</div><h3>その他に使用できる場所</h3><p class="muted">登録済みの商品使用条件にある場所だけ表示します。成分が似ている場合も、用途・濃度・素材・機器との相性を別途確認してください。</p><ul>${conditions.map(c=>`<li>${esc(db.locations.find(l=>l.LocationID===c.LocationID)?.['作業分野']||'場所未登録')} / ${esc(db.locations.find(l=>l.LocationID===c.LocationID)?.['作業場所・部位']||'部材未登録')} — ${esc(c['安全ステータス']||'要注意')}</li>`).join('')||'<li>登録された使用場所はありません。</li>'}</ul></div>`}
function promote(id){const p=db.candidates.find(x=>x.ProductID===id);if(!p)return;if(db.products.some(x=>x['商品名']?.trim().toLowerCase()===p['商品名']?.trim().toLowerCase())){alert('同じ商品名が既に商品マスタにあります');return}const row={ProductID:'P'+String(Date.now()).slice(-8),CandidateSourceProductID:p.SourceProductID,'商品画像URL':p['商品画像URL']||'',商品名:p['商品名'],メーカー:p['メーカー'],'商品分類・用途':p['候補にした汚れ・作業']||'', 'メーカー公式URL':p['出典URL']||'', 'メーカー記載の用途/候補汚れ':p['候補にした汚れ・作業']||'', '商品ランク（一押し/標準/参考）':'参考',確認状況:'未確認・候補',備考:'候補から追加。現行ラベル・SDS確認待ち'};db.products.unshift(row);db.candidates=db.candidates.filter(x=>x.ProductID!==id);save();selected=row.ProductID;render();alert('商品マスタに候補として追加しました。使用条件の確認後に更新してください。')}

let gssCsvDirectory=null;
function openCsvHandleDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open('gss-csv-destination',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('settings'))req.result.createObjectStore('settings')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function getCsvDirectory(){if(gssCsvDirectory)return gssCsvDirectory;const idb=await openCsvHandleDb();const existing=await new Promise((resolve,reject)=>{const req=idb.transaction('settings','readonly').objectStore('settings').get('directory');req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)});if(existing){const p=await existing.queryPermission({mode:'readwrite'});if(p==='granted'){gssCsvDirectory=existing;return existing}if(p==='prompt'&&await existing.requestPermission({mode:'readwrite'})==='granted'){gssCsvDirectory=existing;return existing}}const picked=await window.showDirectoryPicker({id:'gss-csv-folder',mode:'readwrite'});gssCsvDirectory=picked;const tx=idb.transaction('settings','readwrite');tx.objectStore('settings').put(picked,'directory');await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});return picked}
async function csv(k){const rows=db[k]||[];if(!rows.length)return;const cols=[...new Set(rows.flatMap(Object.keys))];const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const text='\ufeff'+[cols.map(q).join(','),...rows.map(r=>cols.map(c=>q(r[c])).join(','))].join('\r\n');if(!window.showDirectoryPicker){alert('このブラウザーでは保存先フォルダーへの直接保存に対応していません。');return}try{const dir=await getCsvDirectory();const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\..+$/,'').replace('T','_');const name=`GSS_${k}_${stamp}.csv`;const file=await dir.getFileHandle(name,{create:true});const writer=await file.createWritable();await writer.write(new Blob([text],{type:'text/csv;charset=utf-8'}));await writer.close();alert(`${name} をGSS_CSVフォルダーに保存しました。`)}catch(e){if(e.name==='AbortError')return;console.error(e);alert('CSVを保存できませんでした。もう一度保存先を選択するか、フォルダーへのアクセスを許可してください。')}}
function tableEditor(){const k=page==='allsheets'?(query.key||'products'):query.key,rows=db[k]||[],cand=k==='candidates',arr=rows,cols=[...new Set(arr.flatMap(Object.keys))],sheets=['products','locations','soils','mapping','conditions','candidates'];return `${page==='allsheets'?`<div class="card"><h2>全シート表示</h2><div class="tabs">${sheets.map(key=>`<button class="btn ${k===key?'selected':''}" onclick="go('allsheets',{key:'${key}'})">${names[key]}</button>`).join('')}</div></div>`:''}<div class="card"><div class="toolbar"><h2>${cand?'新商品候補':names[k]||k}</h2><div><button class="btn" onclick="go('masters')">${page==='allsheets'?'マスタ管理へ':'マスタ一覧'}</button> <button class="btn primary" onclick="csv('${k}')">CSVを保存</button> ${cand?'<button class="btn" onclick="addCandidate()">候補を追加</button>':'<button class="btn" onclick="addRow()">行を追加</button>'}</div></div><div class="muted">CSV保存時に保存先の選択画面が出たら、GSS_CSVフォルダーを指定してください。出力ごとに日時入りの別ファイルを作成します。</div>${cand?'<div class="notice">候補商品は既存商品名と照合して追加しています。製品の存在・現行性・用途・安全性は未確認です。登録前にメーカー資料を確認してください。</div>':''}<div class="tablewrap" style="max-height:65vh;margin-top:12px"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr>${cols.map(c=>`<td><input value="${esc(r[c])}" onchange="editCell('${k}',${i},'${esc(c)}',this.value)"></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function editCell(k,i,c,v){db[k][i][c]=v;save()}function addRow(){const k=query.key;const r={};Object.keys(db[k][0]||{ID:'',名称:''}).forEach(x=>r[x]='');r[Object.keys(r)[0]]='NEW'+Date.now();db[k].unshift(r);save();render()}function addCandidate(){const n=prompt('商品名を入力してください');if(!n)return;if(db.products.some(p=>p['商品名']?.trim()===n.trim())||db.candidates.some(p=>p['商品名']?.trim()===n.trim())){alert('同じ商品名が登録済みです');return}db.candidates.unshift({ProductID:'C'+Date.now(),商品名:n,メーカー:'', '商品分類・用途':'','商品ランク（一押し/標準/参考）':'参考',確認状況:'未確認・候補'});save();render()}
function init(){const c=document.getElementById('calc');if(c)c.onclick=calc;const n=document.getElementById('dname');if(n)n.onchange=()=>{const p=db.products.find(x=>x['商品名']===n.value);const ratio=p?.['希釈倍率']||p?.['希釈倍率・調製方法']||'';const m=String(ratio).match(/^\s*(\d+(?:\.\d+)?)\s*倍\s*$/);const ri=document.getElementById('ratio');if(m){ri.value=m[1];document.getElementById('ratioMsg').textContent='マスタ登録倍率：'+m[1]+'倍'}else{ri.value='';document.getElementById('ratioMsg').textContent='登録済み倍率は未確認です。メーカー表示を確認して入力してください。'}}}const _render=render;render=function(){_render();init()};render();
</script></body></html>
